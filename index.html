<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detroit Sustainable Resources Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Detroit Sustainable Resources Map</h1>
  <div id="controls">
    <label><input type="checkbox" value="community" checked> Community</label>
    <label><input type="checkbox" value="business" checked> Business</label>
    <label><input type="checkbox" value="public_resources" checked> Public Resources</label>
    <label><input type="checkbox" value="transportation" checked> Transportation</label>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
